    <title>Offline — THE INNS</title>
    <style>
        body { margin:0; background:#0F172A; color:#fff; font-family:system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }

<body>
    <div class="card">
        <h1>THE INNS</h1>
        <p><strong>You are offline.</strong> Cached operational data remains available inside the app — POS orders, housekeeping updates and record changes will synchronize automatically when your connection returns.</p>
